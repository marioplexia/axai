[package]
name = "ax-ai"
version = "1.0.0"
description = "Ax Ai - agente de escritorio para asesores de garantias"
edition = "2021"

[lib]
name = "ax_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
enigo = "0.2"
base64 = "0.22"
